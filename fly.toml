# fly.toml file generated for osspublish on 2022-09-22T18:21:19+09:00

app = "osspublish"
kill_signal = "SIGINT"
kill_timeout = 5
swap_size_mb = 512
processes = []

[env]
  RACK_ENV = "production"
  PORT = "8080"

[build]
  build-target = "prod"

[experimental]
  allowed_public_ports = []
  auto_rollback = true

[[services]]
  http_checks = []
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"
  script_checks = []
  [services.concurrency]
    hard_limit = 10
    soft_limit = 2
    type = "connections"

  [[services.ports]]
    force_https = true
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.tcp_checks]]
    grace_period = "1s"
    interval = "15s"
    restart_limit = 0
    timeout = "2s"
