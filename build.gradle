plugins {
	id 'java'
	id 'application'
	id 'org.openjfx.javafxplugin' version '0.0.7'
	id "com.github.johnrengelman.shadow" version "4.0.4"
}

repositories {
	jcenter()
}

javafx {
	modules = [ 'javafx.controls', 'javafx.fxml' ]
}

dependencies {
	compile fileTree(include: ['*.jar'], dir: 'libs')

	testImplementation 'junit:junit:4.12'
}

mainClassName = 'App'
